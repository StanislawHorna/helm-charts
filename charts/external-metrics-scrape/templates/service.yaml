{{- $root := . -}}
{{- range $root.Values.scrapeConfigs }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-svc
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ .name }}
spec:
  ports:
    - name: {{ .name }}-http-metrics
      port: {{ .port }}
      targetPort: {{ .port}}
{{- end }}


