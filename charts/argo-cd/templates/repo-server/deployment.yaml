apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/name: argocd-repo-server
spec:
  replicas: {{ .Values.repoServer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-repo-server
    spec:
      serviceAccountName: argocd-repo-server
      containers:
        - name: argocd-repo-server
          image: "{{ .Values.images.argocd.repository }}:{{ .Values.images.argocd.tag }}"
          imagePullPolicy: {{ .Values.images.argocd.pullPolicy }}
          command: ["argocd-repo-server"]
          ports:
            - containerPort: 8081
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/root-ca.crt
          envFrom:
            - configMapRef:
                name: argocd-cmd-params-cm
                optional: true
          resources:
            {{- toYaml .Values.repoServer.resources | nindent 12 }}
          volumeMounts:
            - name: ca-volume
              mountPath: /etc/ssl/certs/root-ca.crt
              subPath: root-ca.crt
      volumes:
      - name: ca-volume
        secret:
          secretName: self-signed-root-ca