apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/name: argocd-server
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: argocd-server