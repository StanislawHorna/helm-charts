apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-server
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/name: argocd-server
rules:
  # 1. Core K8s resources (Required by startup informers, UI logs, and auth)
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
      - events
      - pods
      - pods/log
      - pods/portforward
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # 2. General cluster inspection (Allows UI to fetch & display live manifests/CRDs)
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
      - delete
      - patch

  - apiGroups:
      - "*"
    resources:
      - "*/finalizers"
    verbs:
      - update

  # 3. Argo CD Custom Resources
  - apiGroups:
      - argoproj.io
    resources:
      - applications
      - applicationsets
      - appprojects
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete