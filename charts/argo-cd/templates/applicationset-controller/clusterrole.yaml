apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-applicationset-controller
  labels:
    {{- include "argocd.labels" . | nindent 4 }}
    app.kubernetes.io/name: argocd-applicationset-controller
rules:
  # ApplicationSet & Application Custom Resources
  - apiGroups:
      - argoproj.io
    resources:
      - applicationsets
      - applicationsets/finalizers
      - applicationsets/status
      - applications
      - appprojects
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Core K8s objects required to evaluate generators and report status
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
      - events
      - namespaces
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch