apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lgtm-stack.componentDeployment" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lgtm-stack.labels" . | nindent 4 }}
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
          fsGroup: 472
          supplementalGroups:
            - 0
      volumes:
        - name: grafana-config
          configMap:
            name: {{ include "lgtm-stack.componentConfig" . }}
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: {{ include "lgtm-stack.componentPVC" . }}
      {{- if .Values.grafana.provisionDatasources }}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
      {{- end }}
      {{- if .Values.grafana.provisionDashboards }}
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
      {{- end }}
      {{- if .Values.grafana.selfSingedRootCA.enabled }}
        - name: ca-volume
          secret:
            secretName: self-signed-root-ca
      {{- end }}
      initContainers:
        - name: init-chown-data
          image: busybox:1.36
          command: ["chown", "-R", "472:472", "/var/lib/grafana"]
          securityContext:
            runAsUser: 0     
          volumeMounts:
            - name: grafana-storage  
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: "grafana/grafana:{{ .Values.grafana.image.tag }}"
          args:
            - --config=/etc/grafana/conf/custom.ini
          ports:
            - name: http
              containerPort: 3000
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/root-ca.crt
            {{- range $key, $value := .Values.grafana.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
          {{- if .Values.grafana.generateAuthentikOAuthSecrets.enabled }}
            - secretRef:
                name: grafana-oauth-secrets
          {{- end }}
          {{- if .Values.grafana.defaultAdminCredentials.enabled }}
            - secretRef:
                name: grafana-admin-creds
          {{- end }}
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-config
              mountPath: /etc/grafana/conf
          {{- if .Values.grafana.provisionDatasources }}
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
          {{- end }}
          {{- if .Values.grafana.provisionDashboards }}
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
          {{- end }}
          {{- if .Values.grafana.selfSingedRootCA.enabled }}
            - name: ca-volume
              mountPath: /etc/ssl/certs/root-ca.crt
              subPath: root-ca.crt
          {{- end }}
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
