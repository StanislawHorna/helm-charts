apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gatus.appName" . }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.data.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}