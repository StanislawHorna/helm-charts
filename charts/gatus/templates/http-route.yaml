{{ if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gatus.appName" .}}-server-http-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io	
      kind: Gateway	
      name: {{ .Values.gateway.gatewayName}}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      sectionName: web
  hostnames:
    - {{ .Values.gateway.rootUrl | replace "https://" "" | replace "http://" ""  }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- if .Values.gateway.allowHttp }}
      backendRefs:
        - group: ''	
          kind: Service	
          name: {{ include "gatus.serviceName" . }}
          port: {{ include "gatus.http.port" . }}
          weight: 1
      {{- else }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
      {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gatus.appName" .}}-server-https-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io	
      kind: Gateway	
      name: {{ .Values.gateway.gatewayName }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      sectionName: websecure
  hostnames:
    - {{ .Values.gateway.rootUrl | replace "https://" "" | replace "http://" ""  }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''	
          kind: Service	
          name: {{ include "gatus.serviceName" . }}
          port: {{ include "gatus.http.port" . }}
          weight: 1
{{ end }}