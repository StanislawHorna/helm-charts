{{- if .Values.selfSingedRootCA.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: self-signed-root-ca
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.selfSingedRootCA.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: self-signed-root-ca
  data:
    - secretKey: root-ca.crt
      remoteRef:
        key: {{ .Values.selfSingedRootCA.kvName }}
        property: {{ .Values.selfSingedRootCA.certificateProperty }}
{{- end }}
