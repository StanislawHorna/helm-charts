apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-access
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsGenerator.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: vault-access
  dataFrom:
  - extract:
      key: {{ .Values.secretsGenerator.vaultAccess.externalSecret.kvName }}
      conversionStrategy: Default
      decodingStrategy: None

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "trek.appName" . }}-admin-creds
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsGenerator.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "trek.appName" . }}-admin-creds
  dataFrom:
  - extract:
      key: "{{ .Values.trek.adminBootstrap.kvPrefix }}/{{ .Values.trek.rootUrl | trimPrefix "https://" | trimPrefix "http://" }}/{{ include "trek.bootstrap.key_name" . }}"
      conversionStrategy: Default
      decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "trek.appName" . }}-oauth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsGenerator.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "trek.appName" . }}-oauth
  data:
  dataFrom:
  - extract:
      key: "{{ .Values.trek.generateAuthentikOAuthSecrets.kvPrefix}}/{{ .Values.trek.generateAuthentikOAuthSecrets.authentikHost | trimPrefix "https://" | trimPrefix "http://" }}/{{ include "trek.authentikOAuthSecrets.key_name" . }}"
      conversionStrategy: Default
      decodingStrategy: None