{{- range .Values.immich.externalLibraries }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .name }}-pv
  namespace: {{ $.Release.Namespace }}
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany # Ensures the container treats it as read-only
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=3
    - nolock
    - hard
    - timeo=600
    - retrans=2
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: {{ .name }}-pv-volume-handle # Unique name for the PV
    volumeAttributes:
      server: {{ .server }} # Your NFS Server IP
      share: {{ .share }} # The actual path on the server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}-pvc
  namespace: {{ $.Release.Namespace }}
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  volumeName: {{ .name }}-pv # Direct link to the PV above
  storageClassName: "" # Must be empty to bind to a static PV
{{- end }}
