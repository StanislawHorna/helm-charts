apiVersion: v1
kind: Service
metadata:
  name: {{ include "immich.server.api.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "immich.server.api.appName" . }}
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 2283
      targetPort: 2283
    - name: metrics-api
      protocol: TCP
      port: 8081
      targetPort: 8081
  selector:
    app: {{ include "immich.server.api.appName" . }}
    