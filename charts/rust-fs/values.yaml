rustFS:
  image:
    tag: 1.0.0-beta.6
  serverDomains: "example.com"
  obsLogLevel: "debug"
  alloyAddress: "http://alloy-svc.lgtm-stack.svc.cluster.local:4318"
  gateway:
    enabled: true
    gatewayName: traefik-gateway
    gatewayNamespace: traefik
    allowHttp: false
    apiHostname: "api.example.com"
    consoleHostname: "console.example.com"
    cors:
      enabled: true
      allowedOrigins:
        - "https://app.example.com"
  storage:
    size: 200Gi
    storageClass: nfs-storage-static
    
  generateAuthentikOAuthSecrets:
    enabled: true
    authentikHost: "https://authentik.example.com"
    kvPrefix: "authentik"


resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "1"

secretsGenerator:
  image:
    name: ghcr.io/stanislawhorna/vault-initial-secrets-generator
    tag: 26.24.2

vaultAuthentication:
  clusterSecretStoreName: "secret-store"
  keyPath: "keyvault/vault.example.com/terraform"

vaultNewObjectsStore:
  clusterSecretStoreName: "secret-store"
  kvName: "k8s"

selfSingedRootCA:
  enabled: true
  ClusterSecretStoreName: "hcp-vault-secret-store"
  kvName: "keyvault/self-signed-root-ca"
  certificateProperty: "certificate"


s3Objects:

  buckets:
    - serviceName: "mimir"
      bucketName: "mimir-data"
    - serviceName: "terraform"
      bucketName: "terraform-state"
