{{- if include "forgejo.hasExternalSecrets" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsGenerator.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: db-creds
  data:
  dataFrom:
  - extract:
      key: "{{ .Values.database.kvPrefix}}/{{ .Values.gateway.hostname }}/{{ include "forgejo.db.secretDetails.key_name" . }}"
      conversionStrategy: Default
      decodingStrategy: None
{{- end }}
