{{- if .Values.forgejoRunner.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "forgejo.runner.appName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forgejo.deployment.runner.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "forgejo.deployment.runner.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "forgejo.deployment.runner.labels" . | nindent 8 }}
    spec:
      initContainers:
        - name: fetch-runner-token
          image: curlimages/curl:8.7.1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Fetching runner registration token from Forgejo API..."
              until RESPONSE=$(curl -s -f -X GET "${FORGEJO_INSTANCE_URL}/api/v1/admin/runners/registration-token" \
                -H "Authorization: token ${ADMIN_PAT}" \
                -H "Accept: application/json"); do
                echo "Waiting for Forgejo API to be available..."
                sleep 3
              done

              RUNNER_TOKEN=$(echo "$RESPONSE" | grep -o '"token":"[^"]*' | cut -d'"' -f4)

              if [ -z "$RUNNER_TOKEN" ]; then
                echo "ERROR: Failed to extract runner token from API response!"
                exit 1
              fi

              echo -n "${RUNNER_TOKEN}" > /shared/runner_token
              echo "Token successfully retrieved and written to /shared/runner_token"
          env:
            - name: FORGEJO_INSTANCE_URL
              value: "http://{{ include "forgejo.server.serviceName" . }}:3000"
            - name: ADMIN_PAT
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-token
                  key: token
          volumeMounts:
            - name: shared-token
              mountPath: /shared

      containers:
        # --- Forgejo Runner Daemon ---
        - name: runner
          image: {{ .Values.forgejoRunner.image.name }}:{{ .Values.forgejoRunner.image.tag }}
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              RUNNER_TOKEN=$(cat /shared/runner_token)
              if [ -z "$RUNNER_TOKEN" ]; then
                echo "ERROR: Runner token is empty! Exiting."
                exit 1
              fi

              echo "Waiting for Docker daemon socket at /var/run/docker.sock..."
              until [ -S /var/run/docker.sock ]; do
                sleep 1
              done

              cp /etc/runner/config.yaml /data/config.yaml

              if [ ! -f /data/.runner ]; then
                forgejo-runner register \
                  --config /data/config.yaml \
                  --no-interactive \
                  --instance "${FORGEJO_INSTANCE_URL}" \
                  --token "${RUNNER_TOKEN}" \
                  --name "${HOSTNAME}" \
                  --labels "ubuntu-latest:docker://catthehacker/ubuntu:act-latest,docker:docker://catthehacker/ubuntu:act-latest"
              fi

              exec forgejo-runner daemon --config /data/config.yaml
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "forgejo-runner unregister --instance ${FORGEJO_INSTANCE_URL} --token $(cat /shared/runner_token) || true"
          env:
            - name: FORGEJO_INSTANCE_URL
              value: "http://{{ include "forgejo.server.serviceName" . }}:3000"
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: shared-token
              mountPath: /shared
            - name: dind-sock
              mountPath: /var/run
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /etc/runner
            # --- MOUNTED TO RUNNER POD FOR CONTAINER BIND-MOUNTS ---
            - name: ca-volume
              mountPath: /etc/docker/certs.d/{{ .Values.gateway.hostname }}
            - name: buildkit-config
              mountPath: /etc/buildkit
          resources:
            {{- .Values.forgejoRunner.resources | toYaml | nindent 12 }}

        # --- Docker-in-Docker (DinD) Engine ---
{{- if .Values.forgejoRunner.dockerInDocker.enabled }}
        - name: dind
          image: {{ .Values.forgejoRunner.dockerInDocker.image.name }}:{{ .Values.forgejoRunner.dockerInDocker.image.tag }}
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              # Background daemon to inject Root CA into all started containers automatically
              (
                echo "Starting automatic CA injector..."
                until docker info >/dev/null 2>&1; do sleep 1; done

                CA_PATH="/etc/docker/certs.d/{{ .Values.gateway.hostname }}/ca.crt"

                if [ -f "$CA_PATH" ]; then
                  echo "CA injector active for target: $CA_PATH"
                  docker events --filter 'event=start' --format '{{ `{{.ID}}` }}' | while read -r CID; do
                    (
                      # Get container's live overlay rootfs path using Helm raw string literals
                      MERGED_DIR=$(docker inspect --format '{{ `{{if .GraphDriver.Data.MergedDir}}{{.GraphDriver.Data.MergedDir}}{{end}}` }}' "$CID" 2>/dev/null)
                      if [ -n "$MERGED_DIR" ] && [ -f "$MERGED_DIR/etc/ssl/certs/ca-certificates.crt" ]; then
                        # Prevent duplicate injection
                        if ! grep -q "SELF-SIGNED-ROOT-CA-INJECTED" "$MERGED_DIR/etc/ssl/certs/ca-certificates.crt" 2>/dev/null; then
                          echo "# SELF-SIGNED-ROOT-CA-INJECTED" >> "$MERGED_DIR/etc/ssl/certs/ca-certificates.crt"
                          cat "$CA_PATH" >> "$MERGED_DIR/etc/ssl/certs/ca-certificates.crt"
                          echo "Successfully injected Root CA into container: $CID"
                        fi
                      fi
                    ) &
                  done
                else
                  echo "WARNING: CA file not found at $CA_PATH"
                fi
              ) &

              # Launch standard DinD entrypoint
              exec dockerd-entrypoint.sh
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: dind-sock
              mountPath: /var/run
            - name: dind-storage
              mountPath: /var/lib/docker
            - name: ca-volume
              mountPath: /etc/docker/certs.d/{{ .Values.gateway.hostname }}
          resources:
            {{- .Values.forgejoRunner.dockerInDocker.resources | toYaml | nindent 12 }}
        {{- end }}

      volumes:
        - name: shared-token
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
        - name: runner-data
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
        - name: runner-config
          configMap:
            name: {{ include "forgejo.runner.appName" . }}-config
        - name: ca-volume
          secret:
            secretName: self-signed-root-ca
            items:
              - key: root-ca.crt
                path: ca.crt
        - name: buildkit-config
          configMap:
            name: {{ include "forgejo.runner.appName" . }}-buildkit-config
{{- end }}