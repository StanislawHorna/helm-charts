apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-bootstrap-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-bootstrap-secret-writer
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-bootstrap-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: forgejo-bootstrap-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: forgejo-bootstrap-secret-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: 3-forgejo-bootstrap-settings
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: forgejo-bootstrap-sa  
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-forgejo-ready
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Forgejo HTTP server to report healthy..."
              until wget -q --spider http://{{ include "forgejo.server.serviceName" . }}:3000/api/v1/version; do
                sleep 3
              done
              echo "Forgejo is ready!"
      containers:
        - name: forgejo-bootstrap-settings
          image: "{{ .Values.forgejo.image.name }}:{{ .Values.forgejo.image.tag }}"
          imagePullPolicy: {{ .Values.forgejo.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Checking if admin user '${FORGEJO_ADMIN_USERNAME}' exists..."
              if forgejo --config "${CONFIG_FILE}" admin user list | grep -q "${FORGEJO_ADMIN_USERNAME}"; then
                echo "Admin user already exists. Skipping."
              else
                echo "Admin user does not exist. Proceeding to create..."
                echo "Creating admin user '${FORGEJO_ADMIN_USERNAME}'..."
                forgejo --config "$CONFIG_FILE" admin user create \
                  --admin \
                  --username "${FORGEJO_ADMIN_USERNAME}" \
                  --password "${FORGEJO_ADMIN_PASSWORD}" \
                  --email "${FORGEJO_ADMIN_EMAIL}" \
                  --must-change-password=false
                
                echo "Admin user created successfully!"
              fi
              SECRET_NAME="forgejo-admin-token"
              KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              KUBE_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

              # Check if secret already exists to ensure idempotency
              SECRET_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" --cacert $KUBE_CA \
                -H "Authorization: Bearer $KUBE_TOKEN" \
                "https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/secrets/${SECRET_NAME}")

              if [ "$SECRET_EXISTS" -eq 200 ]; then
                echo "Secret '${SECRET_NAME}' already exists. Skipping PAT generation."
              else
                echo "Generating Admin PAT for Actions Runner bootstrapping..."
                
                # Generate token with write:admin scope
                PAT=$(forgejo --config "$CONFIG_FILE" admin user generate-access-token \
                  --username "${FORGEJO_ADMIN_USERNAME}" \
                  --token-name "helm-bootstrap-$(date +%s)" \
                  --scopes "write:admin" \
                  --raw | tail -n 1)

                # Base64 encode token
                ENCODED_PAT=$(echo -n "$PAT" | base64 | tr -d '\n')

                # Create Secret via K8s REST API
                curl -s -f --cacert $KUBE_CA \
                  -H "Authorization: Bearer $KUBE_TOKEN" \
                  -H "Content-Type: application/json" \
                  -X POST \
                  "https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/secrets" \
                  -d "{
                    \"apiVersion\": \"v1\",
                    \"kind\": \"Secret\",
                    \"metadata\": { \"name\": \"${SECRET_NAME}\" },
                    \"type\": \"Opaque\",
                    \"data\": { \"token\": \"${ENCODED_PAT}\" }
                  }"

                echo "Secret '${SECRET_NAME}' created successfully!"
              fi

              if forgejo --config "${CONFIG_FILE}" admin auth list | grep -q "${FORGEJO_PROVIDER_NAME}"; then
                echo "${FORGEJO_PROVIDER_NAME} OAuth provider already exists. Skipping."
              else
                echo "${FORGEJO_PROVIDER_NAME} OAuth provider does not exist. Proceeding to add..."
                echo "Adding ${FORGEJO_PROVIDER_NAME} OAuth provider..."
                forgejo --config "${CONFIG_FILE}" admin auth add-oauth \
                  --name "${FORGEJO_PROVIDER_NAME}" \
                  --provider "openidConnect" \
                  --key "${FORGEJO_AUTH_GENERIC_OAUTH_CLIENT_ID}" \
                  --secret "${FORGEJO_AUTH_GENERIC_OAUTH_CLIENT_SECRET}" \
                  --auto-discover-url "${FORGEJO_AUTH_AUTO_DISCOVER_URL}" \
                  --scopes "openid profile email groups" \
                  --group-claim-name "groups" \
                  --admin-group "{{ .Values.forgejo.generateAuthentikOAuthSecrets.forgejoAdminGroup }}" \
                  --icon-url "${FORGEJO_AUTHENTIK_ICON_URL}"

                echo "${FORGEJO_PROVIDER_NAME} OAuth provider added successfully!"
              fi
          env:
            {{- include "forgejo.server.env" . | nindent 12 }}
          envFrom:
            {{- include "forgejo.server.envFrom" . | nindent 12 }}
          volumeMounts:
            {{- include "forgejo.server.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "forgejo.server.volumes" . | nindent 8 }}