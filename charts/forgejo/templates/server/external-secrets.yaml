{{- if include "forgejo.hasExternalSecrets" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsGenerator.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: forgejo-bootstrap
  dataFrom:
  - extract:
      key: "{{ .Values.forgejoBootstrap.kvPrefix}}/{{ .Values.gateway.hostname }}/{{ include "forgejo.bootstrap.key_name" . }}"
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oauth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsGenerator.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: forgejo-oauth
  dataFrom:
  - extract:
      key: "{{ .Values.forgejo.generateAuthentikOAuthSecrets.kvPrefix}}/{{ .Values.forgejo.generateAuthentikOAuthSecrets.authentikHost | trimPrefix "https://" | trimPrefix "http://" }}/{{ include "forgejo.authentikOAuthSecrets.key_name" . }}"
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
{{- end }}
