{{- if include "authentik.hasExternalSecrets" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-access
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsGenerator.vaultAccess.externalSecret.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: vault-access
  data:
  dataFrom:
  - extract:
      key: {{ .Values.secretsGenerator.vaultAccess.externalSecret.path }}
      conversionStrategy: Default
      decodingStrategy: None

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsGenerator.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: authentik-bootstrap
  data:
  dataFrom:
  - extract:
      key: "{{ .Values.authentikBootstrap.kvPrefix}}/{{ .Values.gateway.hostname }}/{{ include "authentik.bootstrap.key_name" . }}"
      conversionStrategy: Default
      decodingStrategy: None
{{- end }}
