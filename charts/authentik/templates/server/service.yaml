apiVersion: v1
kind: Service
metadata:
  name: {{ include "authentik.server.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "authentik.deployment.server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 9000
      targetPort: 9000
    - name: https
      protocol: TCP
      port: 9443
      targetPort: 9443
  selector:
    {{- include "authentik.deployment.server.labels" . | nindent 4 }}