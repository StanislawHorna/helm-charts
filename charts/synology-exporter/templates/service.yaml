apiVersion: v1
kind: Service
metadata:
  name: {{ include "synology-exporter.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "synology-exporter.appName" . }}
spec:
  selector:
    app: {{ include "synology-exporter.appName" . }}
  ports:
    - name: metrics
      protocol: TCP
      port: 9116
      targetPort: 9116