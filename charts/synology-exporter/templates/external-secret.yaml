{{- if and (include "synology-exporter.hasExternalSecrets" .) .Values.externalSecret -}} {{/* Changed .Values.externalSecret.enabled to just .Values.externalSecret check */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsm-exporter-config
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.externalSecret.ClusterSecretStoreName | default "default-store" }}
    kind: ClusterSecretStore
  target:
    name: dsm-exporter-config
    template:
      engineVersion: v2
      data:
        snmp.yml: |

          auths:
{{- range .Values.synologyDevices }}

            {{ .name }}:
              version: {{ .snmpSettingsVersion | default $.Values.defaultSnmpSettings.version }}
              security_level: {{ .snmpSettingsSecurity_level | default $.Values.defaultSnmpSettings.security_level }}
              username: {{ printf "{{ .%s_DSM_USERNAME }}" (.name | replace "-" "_") }}
              password: {{ printf "{{ .%s_DSM_PASSWORD }}" (.name | replace "-" "_") }}
              auth_protocol: {{ .snmpSettingsAuth_protocol | default $.Values.defaultSnmpSettings.auth_protocol }}
              priv_protocol: {{ .snmpSettingsPriv_protocol | default $.Values.defaultSnmpSettings.priv_protocol }}
              priv_password: {{ printf "{{ .%s_DSM_PRIV_PASSWORD }}" (.name | replace "-" "_") }}
{{- end }}
          modules:

{{- range $path, $_ := .Files.Glob "files/snmp_modules_*.yml" }}
      {{- $.Files.Get $path | nindent 12 }}
{{- end }}
  data:
{{- range .Values.synologyDevices }}
{{- $deviceExternalSecret := .externalSecret | default dict }}
{{- $safeName := .name | replace "-" "_" }}
{{- /* Use $.Values to reach the top level from inside the range loop */}}
  - remoteRef:
      key: {{ $deviceExternalSecret.kvName | default $.Values.externalSecret.kvName }}
      property: {{ $deviceExternalSecret.username | default $.Values.externalSecret.username }}
    secretKey: {{ $safeName }}_DSM_USERNAME
  - remoteRef:
      key: {{ $deviceExternalSecret.kvName | default $.Values.externalSecret.kvName }}
      property: {{ $deviceExternalSecret.password | default $.Values.externalSecret.password }}
    secretKey: {{ $safeName }}_DSM_PASSWORD
  - remoteRef:
      key: {{ $deviceExternalSecret.kvName | default $.Values.externalSecret.kvName }}
      property: {{ $deviceExternalSecret.privatePassword | default $.Values.externalSecret.privatePassword }}
    secretKey: {{ $safeName }}_DSM_PRIV_PASSWORD
{{- end }}
{{- end -}}