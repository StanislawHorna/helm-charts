apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cache.appName" . }}
  labels:
    app: {{ include "cache.appName" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cache.appName" . }}
  template:
    metadata:
      labels:
        app: {{ include "cache.appName" . }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.cache.image.name }}:{{ .Values.cache.image.tag }}"
          resources:
            {{- toYaml .Values.cache.resources | nindent 12 }}
            
          ports:
            - name: redis
              containerPort: {{ include "cache.port" . }}
              protocol: TCP
          # Liveness and Readiness probes using native redis-cli
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
