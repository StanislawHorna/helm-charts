apiVersion: v1
kind: Service
metadata:
  name: {{ include "netbox.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "netbox.appName" . }}
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: {{ include "netbox.server.http.port" . }}
      targetPort: {{ include "netbox.server.http.port" . }}
  selector:
    app: {{ include "netbox.appName" . }}
    