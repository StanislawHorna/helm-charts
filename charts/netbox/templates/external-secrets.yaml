apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-access
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsGenerator.vaultAccess.externalSecret.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: vault-access
  dataFrom:
  - extract:
      key: {{ .Values.secretsGenerator.vaultAccess.externalSecret.kvName }}
      conversionStrategy: Default
      decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "netbox.bootstrap.key_name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsGenerator.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "netbox.bootstrap.key_name" . }}
  dataFrom:
  - extract:
      key: "{{ .Values.secretsGenerator.kvPrefix}}/{{ .Values.gateway.hostname }}/{{ include "netbox.bootstrap.key_name" . }}"
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "netbox.oauth.key_name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsGenerator.ClusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "netbox.oauth.key_name" . }}
  dataFrom:
  - extract:
      key: "{{ .Values.generateAuthentikOAuthSecrets.kvPrefix }}/{{ .Values.generateAuthentikOAuthSecrets.authentikHost | trimPrefix "https://" | trimPrefix "http://"  }}/{{ include "netbox.oauth.key_name" . }}"
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None